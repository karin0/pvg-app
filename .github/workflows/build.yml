name: Build

on:
  release:
    types: [published] # include pre-releases
  push:
    branches: # ignore any tags
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs tags for the ui-version meta

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

      - name: Compress
        run: |
          FILE=pvg-app-${GITHUB_SHA::7}.tar.xz
          echo "FILE=$FILE" >> $GITHUB_ENV
          tar -cJvf $FILE dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}

      - name: Compress for Release
        if: ${{ github.event_name == 'release' }}
        run: |
          ZIP_FILE=pvg-app-${GITHUB_REF##*/}.zip
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          cd dist
          zip -r ../$ZIP_FILE *

      - uses: shogo82148/actions-upload-release-asset@9ee13965a8a51926f330b424693f25fcff8f2ef6 # v1.10.6
        if: ${{ github.event_name == 'release' }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ env.ZIP_FILE }}
